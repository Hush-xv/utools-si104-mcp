[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utools-si104-mcp"
version = "1.1.0"
description = "MCP server wrapping the UTools-SI104 USB-to-SPI/I2C adapter SDK (14 tools)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.25,<2"]

[project.scripts]
si104-mcp = "server:main"

# The vendor wheel (utools_si104) is deliberately NOT a pip dependency — it is
# license-restricted and must be installed from the official SDK package into
# the same environment (see README).

[tool.setuptools]
py-modules = ["server", "si104_stub"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Deterministic pin: ruff 0.17+ widened its defaults with style rules the
# hardware-validated test scripts don't comply with; lint real errors only.
select = ["E4", "E7", "E9", "F"]
