name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps (vendor wheel stays out of CI — stub mode)
        run: python -m pip install --upgrade pip -e . ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests (si104_stub)
        run: python unit_test.py
      - name: Smoke test (stdio, STUB MODE)
        run: python smoke_test.py
